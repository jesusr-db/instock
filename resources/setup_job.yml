resources:
  jobs:
    setup_job:
      name: "[inStockCV] Setup"

      tasks:
        - task_key: create_endpoint
          spark_python_task:
            python_file: ../setup/create_endpoint.py
          environment_key: default

        - task_key: deploy_yolo_endpoint
          depends_on:
            - task_key: create_endpoint
          spark_python_task:
            python_file: ../setup/deploy_yolo_endpoint.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: ml_deploy

        # SAM and CLIP run in parallel — independent of YOLO and each other.
        # All ML packages (ultralytics, efficientvit, open-clip-torch) are only imported
        # inside load_context (inference-time), so serverless is sufficient at model-log time.
        - task_key: deploy_sam_endpoint
          spark_python_task:
            python_file: ../setup/deploy_sam_endpoint.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: ml_deploy

        - task_key: deploy_clip_endpoint
          spark_python_task:
            python_file: ../setup/deploy_clip_endpoint.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: ml_deploy

        - task_key: provision_tables
          depends_on:
            - task_key: deploy_yolo_endpoint
          spark_python_task:
            python_file: ../setup/create_tables.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: default

        # build_clip_index needs both: the CLIP endpoint (to embed) and the tables (to write)
        - task_key: build_clip_index
          depends_on:
            - task_key: provision_tables
            - task_key: deploy_clip_endpoint
          spark_python_task:
            python_file: ../setup/build_clip_index.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
          environment_key: clip_index

      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - "databricks-sdk>=0.28.0"

        - environment_key: ml_deploy
          spec:
            client: "1"
            dependencies:
              - "mlflow>=2.10.0"
              - "huggingface_hub>=0.20.0"
              - "databricks-sdk>=0.28.0"

        - environment_key: clip_index
          spec:
            client: "1"
            dependencies:
              - "databricks-sdk>=0.28.0"
              - "databricks-vectorsearch>=0.37.0"
              - "open-clip-torch>=2.24.0"
              - "Pillow>=10.3.0"
