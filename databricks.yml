bundle:
  name: instockcv

sync:
  # The React build output is in .gitignore (so it doesn't pollute commits),
  # but the deployed app needs it — uvicorn serves it as static files.
  include:
    - app/frontend/dist/**

variables:
  catalog:
    description: Unity Catalog name (override per workspace)
    default: vdm_classic_rikfy0_catalog
  schema:
    description: Schema name (production)
    default: instockcv
  schema_dev:
    description: Schema name (development)
    default: instockcv_dev
  deploy_oss_model:
    description: Set to 'true' to deploy Qwen3-VL-8B OSS model endpoint
    default: "false"
  sql_warehouse_http_path:
    description: HTTP path for the SQL warehouse used by the app
    default: ""

targets:
  dev:
    mode: development
    default: true
    variables:
      schema: instockcv_dev

  prod:
    mode: production

include:
  - resources/*.yml
