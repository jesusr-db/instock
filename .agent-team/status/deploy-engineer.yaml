concerns:
  - "Workspace 'main' catalog is unavailable; deployed against 'vdm_classic_rikfy0_catalog' (the per-workspace user catalog). Updated databricks.yml default + app.yml + .env.example accordingly. The team manifest's hardcoded 'main.instockcv' references are now overridden everywhere needed."
  - "Original config.py required DATABRICKS_TOKEN as a mandatory env var — Databricks Apps don't set that variable. Refactored Settings to make databricks_token optional and added get_databricks_token() that falls back to WorkspaceClient.config.authenticate() (OAuth m2m). Local dev still works via DATABRICKS_TOKEN env."
  - "DATABRICKS_HOST in Databricks Apps is just the hostname (no scheme); added a model_post_init in Settings to prepend 'https://' so OpenAI base_url stays well-formed."
  - "create_tables.py: original `from setup.generate_inventory import ...` failed in the Databricks job runtime because the script is exec'd with no package context and __file__ is undefined. Refactored to a 3-strategy resolver (plain import → __file__-relative → cwd-relative) and added explicit pyspark schema for the inventory table to prevent INT vs LONG merge failures."
  - "App requirements.txt must live at app/ root, not app/backend/. Added app/requirements.txt as a copy."
  - "DAB sync excluded app/frontend/dist/ because of .gitignore. Added sync.include in databricks.yml to whitelist dist for deployment."
  - "Local CLI had a Terraform signature-verification bug (key expired). Worked around with DATABRICKS_TF_EXEC_PATH=/opt/homebrew/bin/terraform + DATABRICKS_TF_VERSION=1.14.9. Document this in deploy README."
