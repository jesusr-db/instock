name: inStockCV
description: >
  Mobile-optimized Databricks App (React + FastAPI) for retail store employees to
  photograph products and instantly check inventory quantities against a synthetic
  Delta table catalog, with AI-powered SKU extraction via Databricks AI Gateway.

plan: docs/superpowers/plans/2026-04-29-instockcv-implementation.md

variables:
  catalog: main
  schema: instockcv
  schema_dev: instockcv_dev
  endpoint_name: instockcv-gateway

agents:
  - name: data-engineer
    template: data-engineer
    model: sonnet
    phase: 1
    parallel_group: 1
    description: >
      Creates project scaffold (DAB bundle, .gitignore, directory structure),
      implements synthetic inventory generator, and creates Delta table DDL +
      data loading scripts (Tasks 1–3).

  - name: genai-architect
    template: genai-architect
    model: opus
    phase: 1
    parallel_group: 1
    description: >
      Implements AI Gateway external model endpoint provisioning (GPT-4o)
      via Databricks SDK (Task 4).

  - name: app-developer
    template: app-developer
    model: sonnet
    phase: 2
    parallel_group: 2
    description: >
      Implements the complete FastAPI backend (config, /analyze, /lookup, main)
      and React/TypeScript/Vite frontend (API client, ScanPanel, ResultCard, App root).
      Covers Tasks 5–13.

  - name: qa-engineer
    template: qa-engineer
    model: sonnet
    phase: 3
    parallel_group: 3
    description: >
      Validates code quality, test coverage (27 tests), contract compliance,
      and integration correctness across all agents.

  - name: deploy-engineer
    template: deploy-engineer
    model: sonnet
    phase: 4
    parallel_group: 4
    description: >
      Finalizes app/app.yml with real warehouse path, verifies DAB bundle config,
      and deploys to Databricks workspace (Tasks 14–15).

roadmap:
  - id: oss-model
    name: Qwen3-VL-8B OSS Model (HuggingFace)
    plan_task: "Optional Task 16"
    status: not_started
    description: >
      Deploy Qwen3-VL-8B-Instruct from HuggingFace as an MLflow pyfunc model,
      register to Unity Catalog, and create a serving endpoint instockcv-qwen3vl.
      Adds a second option to the model dropdown alongside GPT-4o.
    trigger: DEPLOY_OSS_MODEL=true
    implementation_file: setup/deploy_oss_model.py
    requirements:
      - GPU cluster (A10G or better) for model registration
      - transformers>=4.45.0, qwen-vl-utils>=0.0.8, torch>=2.3.0, accelerate>=0.30.0
      - Unity Catalog model registry (mlflow.set_registry_uri("databricks-uc"))
    steps:
      - Register Qwen3VLWrapper pyfunc model to main.instockcv.instockcv_qwen3vl
      - Create serving endpoint instockcv-qwen3vl (scale-to-zero enabled)
      - Add ADDITIONAL_MODEL_ROUTES=instockcv-qwen3vl to app/app.yml env section
      - Redeploy bundle — UI dropdown will show both GPT-4o and Qwen3-VL-8B
    notes: >
      Run manually after core app is deployed and validated. Requires a GPU cluster
      — do not add to automated team build.

phases:
  - id: 1
    name: Foundation
    description: Scaffold, synthetic data pipeline, and AI Gateway endpoint — run in parallel
    parallel_groups:
      - id: 1
        agents: [data-engineer, genai-architect]

  - id: 2
    name: Application
    description: Full-stack FastAPI + React implementation
    parallel_groups:
      - id: 2
        agents: [app-developer]

  - id: 3
    name: Validation
    description: QA gate — code review, test suite, contract compliance
    parallel_groups:
      - id: 3
        agents: [qa-engineer]

  - id: 4
    name: Deployment
    description: DAB bundle finalization and Databricks deployment
    parallel_groups:
      - id: 4
        agents: [deploy-engineer]
