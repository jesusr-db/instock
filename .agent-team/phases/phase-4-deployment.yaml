id: 4
name: Deployment
description: >
  Finalize app/app.yml, create secret scope, build frontend, deploy DAB bundle,
  run setup job (provision tables + create AI Gateway endpoint).

depends_on: [3]

parallel_groups:
  - id: 4
    agents:
      - name: deploy-engineer
        worktree: false
        tasks:
          - "Task 14: Create app/app.yml and .env.example"
          - "Task 15: Deploy bundle (databricks bundle deploy --target dev)"
          - "Task 15: Run setup job (databricks bundle run setup_job)"
          - "Task 15: Verify end-to-end app accessibility"
        exit_condition: "App URL accessible, setup job completed successfully"

input_contracts:
  - contracts/app-developer-to-deploy-engineer.yaml

steps:
  read_phase_config: pending
  resolve_contracts: pending
  dispatch_agents: pending
  await_agents: pending
  merge_worktrees: pending
  qa_gate: pending
  update_progress: pending
  introspection: pending

qa_gate:
  checks:
    - "app/app.yml exists with uvicorn command"
    - "databricks bundle validate passes"
    - "setup_job run completes successfully (tables created, endpoint provisioned)"
    - "App URL responds to HTTP GET"
  on_fail: escalate_to_human
