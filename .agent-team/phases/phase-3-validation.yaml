id: 3
name: Validation
description: >
  QA gate — comprehensive validation of code quality, test coverage,
  contract compliance, security, and integration correctness.

depends_on: [2]

parallel_groups:
  - id: 3
    agents:
      - name: qa-engineer
        worktree: false
        tasks:
          - "Run full test suite (27 tests)"
          - "Validate frontend build"
          - "Check file completeness against plan File Map"
          - "Verify contract compliance (table schemas, endpoint name, API shapes)"
          - "Security scan (no hardcoded secrets)"
          - "Code quality checks"
        exit_condition: "status = PASS or PASS_WITH_WARNINGS"

steps:
  read_phase_config: pending
  resolve_contracts: pending
  dispatch_agents: pending
  await_agents: pending
  merge_worktrees: pending
  qa_gate: pending
  update_progress: pending
  introspection: pending

qa_gate:
  checks:
    - "qa-engineer status != FAIL"
    - ".agent-team/status/qa-engineer.yaml written"
  on_fail: escalate_to_human
